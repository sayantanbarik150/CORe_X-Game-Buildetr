name: gxc-test

on:
  push:
    paths:
      - .github/workflows/gxc-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe pricing endpoints
        run: |
          {
          echo "=== GET msp/1089 ==="
          curl -s -m 30 -H 'Accept: application/json' https://api.goextracash.com/msp/1089 ; echo
          echo "=== GET device/1089 ==="
          curl -s -m 30 https://api.goextracash.com/device/1089 ; echo
          echo "=== POST order/initiate ==="
          OID_RESP=$(curl -s -m 30 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"id":1089}' https://api.goextracash.com/order/initiate)
          echo "$OID_RESP"
          OID=$(echo "$OID_RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("order_id",""))' 2>/dev/null)
          echo "ORDER_ID=$OID"
          echo "=== POST checkout BEST (all perfect + all accessories + 12m+ warranty) ==="
          curl -s -m 30 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "{\"id\":1089,\"order_id\":\"$OID\",\"available_charger\":\"true\",\"available_earphone\":\"true\",\"available_box\":\"true\",\"available_bill\":\"true\",\"warranty_12mmore\":\"true\"}" \
            https://api.goextracash.com/checkout ; echo
          echo "=== POST checkout WORST (screen cracked + panel crack + no accessories + 1month warranty) ==="
          curl -s -m 30 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "{\"id\":1089,\"order_id\":\"$OID\",\"scratches_crack\":\"true\",\"display_heavyspot\":\"true\",\"touch_notworking\":\"true\",\"panel_crack\":\"true\",\"body_dent_major\":\"true\",\"body_scratch_major\":\"true\",\"notworking_battery\":\"true\",\"warranty_1month\":\"true\"}" \
            https://api.goextracash.com/checkout ; echo
          echo "=== POST checkout MID (minor scratches only, charger+box) ==="
          curl -s -m 30 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "{\"id\":1089,\"order_id\":\"$OID\",\"scratches_minor\":\"true\",\"body_scratch_minor\":\"true\",\"available_charger\":\"true\",\"available_box\":\"true\",\"warranty_12month\":\"true\"}" \
            https://api.goextracash.com/checkout ; echo
          echo "=== checkout without order_id ==="
          curl -s -m 30 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"id":1089,"warranty_12mmore":"true"}' https://api.goextracash.com/checkout ; echo
          echo "=== checkout with bogus order_id ==="
          curl -s -m 30 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"id":1089,"order_id":"TEST-BOGUS-000","warranty_12mmore":"true"}' https://api.goextracash.com/checkout ; echo
          } > scrape_out/08_pricing_test.txt 2>&1

      - name: Commit results
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -A scrape_out
          git commit -m "scrape: pricing endpoint test [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{GITHUB_REF_NAME}}
