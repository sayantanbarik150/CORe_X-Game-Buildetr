name: gxc-test

on:
  push:
    paths:
      - .github/workflows/gxc-test.yml
      - scripts/gxc_probe.py
      - scripts/gxc_probe2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Run pricing probe
        run: python3 scripts/gxc_probe2.py > scrape_out/08_pricing_test.txt 2>&1 || true
      - name: Commit results
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -A scrape_out
          git commit -m "scrape: pricing endpoint test [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
