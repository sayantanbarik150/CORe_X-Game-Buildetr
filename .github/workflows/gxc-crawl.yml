name: gxc-crawl

on:
  push:
    paths:
      - .github/workflows/gxc-crawl.yml
      - scripts/gxc_crawl.py

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Crawl catalog
        run: python3 scripts/gxc_crawl.py
      - name: Commit data
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -A data
          git commit -m "data: full GoExtraCash catalog [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
