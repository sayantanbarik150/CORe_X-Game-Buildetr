name: gxc-discover

on:
  push:
    paths:
      - .github/workflows/gxc-discover.yml
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage
        run: |
          curl -sL https://www.goextracash.com/ -o home.html
          echo "HOMEBYTES: $(wc -c < home.html)"
          echo "== buildId / NEXT_DATA hints =="
          grep -oE '"buildId":"[^"]+"' home.html | sort -u | head -5
          echo "== assets =="
          grep -oE '(src|href)="[^"]+\.(js|json)"' home.html | sed 's/.*="//;s/"$//' | sort -u | head -60

      - name: Download JS bundles and extract endpoints
        run: |
          mkdir -p js && cd js
          curl -sL https://www.goextracash.com/ -o ../home.html
          grep -oE 'src="[^"]+\.js[^"]*"' ../home.html | sed 's/src="//;s/"$//' | sort -u > ../assets.txt
          cat ../assets.txt
          i=0
          while read -r u; do
            case "$u" in
              http*) full="$u";;
              /*) full="https://www.goextracash.com$u";;
              *) full="https://www.goextracash.com/$u";;
            esac
            i=$((i+1))
            curl -sL "$full" -o "b$i.js"
            echo "GOT $full -> b$i.js ($(wc -c < b$i.js) bytes)"
          done < ../assets.txt
          echo "== api.goextracash.com references =="
          grep -ohE 'api\.goextracash\.com/[A-Za-z0-9_./?=&{}$%-]*' *.js 2>/dev/null | sort -u | head -100
          echo "== quoted /api/ paths =="
          grep -ohE '"/?api/[A-Za-z0-9_./?=&{}$%-]*"' *.js 2>/dev/null | sort -u | head -100
          echo "== BASE_URL style env =="
          grep -ohE '(NEXT_PUBLIC|REACT_APP|VITE)_[A-Z_]*API[A-Z_]*[^,;)]{0,80}' *.js 2>/dev/null | sort -u | head -40

      - name: Fetch a device page HTML
        run: |
          curl -sL "https://www.goextracash.com/devices/IPHONE%2013" -o dev.html
          echo "DEVBYTES: $(wc -c < dev.html)"
          echo "== inline json hints =="
          grep -oE '"(buildId|device|variant|condition|price)[A-Za-z]*":[^,]{0,40}' dev.html | sort -u | head -40
          echo "== script srcs =="
          grep -oE 'src="[^"]+\.js[^"]*"' dev.html | sed 's/src="//;s/"$//' | sort -u | head -60
