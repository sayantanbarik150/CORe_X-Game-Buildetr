name: gxc-discover

on:
  push:
    paths:
      - .github/workflows/gxc-discover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download all lazy chunks
        run: |
          mkdir -p scrape_out/chunks
          for f in common.2d844c25cc9c3890.js 83.0476dca6d0009aa6.js 185.70fcecfd07cf8b0f.js 310.ff93789ab829d0c0.js 433.97125f8fa6b2dc8b.js 469.3abdda91e86e673d.js 505.6ca17ad92be187aa.js 742.4a9a907c12d63b61.js 744.965f78c70b8656b0.js 828.39fb3360bfd91c8b.js 1207.c31c58ba921c7544.js 1312.b30a64ba55502e13.js 1315.7fe5fa9219b74024.js 1371.5d786b155184e0f4.js 1372.c332ef5e8689b6a0.js 1396.6d2fd488c15039d7.js 1745.1d0e2ead40f0c005.js 1751.938b5b4334b8b6d7.js 1802.1f071c9f994ba969.js 1933.012f4e875366f39e.js 2061.00d8ab7c1e70f133.js polyfills-core-js.93f56369317b7a8e.js 2543.4ecb9d67baa1006c.js 2559.9a87c0137e5b832b.js 2776.8e61e54dd00ed7c1.js 2841.90d88764b2511758.js 2975.d4a3a8de95daffe4.js 3135.9b32e5171ebdb5e5.js 3150.b385f5653f17897f.js 3287.3cf1e219f02d3fe4.js 3483.d45d1ac5dcf2f18d.js 3544.4e1ffc7d2a8b0060.js 3672.bd6f90c58351e576.js 3734.f7e07053d3740a57.js 3824.021428b568a1b9f0.js 3998.5777d7784aed56a1.js 4041.ca6bfdb5684b1261.js 4087.4d3d6c0045bee110.js 4090.45a352ecc92a34a2.js 4148.d498436706ebc7d9.js 4340.c7b934a07225cd1c.js 4458.f8733472cc36710a.js 4530.0b6bc9485fdd65c6.js 4741.222084961af85f25.js 4764.097a3d01bd7326d7.js 4771.a8330af9536a1eb5.js 5217.55cd7c701a3b5204.js 5454.a50a882f6f6679fc.js 5586.17c7417547179648.js 5675.2171273233c17bee.js 5860.677f53458c6c1d4c.js 5962.cb92da0853ab2601.js 6304.ea84f366beea79ee.js 6642.f555a673d439add1.js 6673.84a34147847e39e5.js polyfills-dom.516ff539260f3e0d.js 6754.d1d9a9ace39e263f.js 7059.1deb0105d4e38418.js 7116.36079565043dbcf8.js 7219.ecc1c9bef752449f.js 7465.0cfd481fe58b2119.js 7513.c8c9b5ab52a0bbe4.js 7635.001dbf8d6ae44798.js 7666.ee5d47d88504157a.js 8058.92bc3c5df214f8f0.js 8194.0a73a3dfd278bb59.js 8382.9b76719cb8b87eb5.js 8484.06a77f1145488f52.js 8487.ca1eb243fe230331.js 8577.273ea792419be5c6.js common.2d844c25cc9c3890.js 8633.78084433b69827de.js 8764.d806b37050c0758e.js 8777.0d8d6954de17be3c.js 8811.59fbd61cb8f382c5.js 8866.f720f8df21946b48.js 8877.d87b1dd394db06f1.js 8881.2d06967bd505116f.js 9235.acd2c9a6970f1326.js 9352.4ceb0d17907703d3.js 9418.7247e87ba38328b6.js 9588.1cc95fab80f3cf77.js 9793.b779751b21b0900c.js 9820.d5a15e4b1f1e048f.js 9857.a09c73c9efeebb2b.js 9882.1863743389167ae2.js; do
            curl -sL --fail -m 30 "https://www.goextracash.com/$f" -o "scrape_out/chunks/$f" || echo "FAIL $f"
          done
          echo "COUNT: $(ls scrape_out/chunks | wc -l)"
          du -sh scrape_out/chunks
          echo "SIZES:"; ls -l scrape_out/chunks | awk '{print $5}' | sort -n | uniq -c | tail -5

      - name: Commit results
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -A scrape_out
          git commit -m "scrape: chunks v2 [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
