name: gxc-discover

on:
  push:
    paths:
      - .github/workflows/gxc-discover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download frontend bundle
        run: |
          mkdir -p scrape_out/bundle
          curl -sL https://www.goextracash.com/ -o /tmp/home.html
          for f in $(grep -oE '(main|polyfills|runtime)\.[a-z0-9]+\.js' /tmp/home.html | sort -u); do
            curl -sL "https://www.goextracash.com/$f" -o "scrape_out/bundle/$f"
            echo "$f $(wc -c < scrape_out/bundle/$f)"
          done

      - name: Probe endpoints around /brands
        run: |
          {
          probe() {
            code=$(curl -s -o /tmp/out.bin -w "%{http_code}" -m 20 "$1")
            size=$(wc -c < /tmp/out.bin)
            echo "### $1 -> HTTP $code ($size bytes)"
            if [ "$code" = "200" ]; then head -c 600 /tmp/out.bin | tr -d '\n'; echo; fi
          }
          probe "https://api.goextracash.com/brands"
          for n in 1 2 3; do
            probe "https://api.goextracash.com/brands/$n"
            probe "https://api.goextracash.com/brands/$n/series"
            probe "https://api.goextracash.com/series/$n"
            probe "https://api.goextracash.com/series?brand=$n"
            probe "https://api.goextracash.com/series?brand_id=$n"
            probe "https://api.goextracash.com/devices/$n"
            probe "https://api.goextracash.com/models/$n"
            probe "https://api.goextracash.com/variants/$n"
          done
          probe "https://api.goextracash.com/series/Apple"
          probe "https://api.goextracash.com/series?name=Apple"
          probe "https://api.goextracash.com/device/IPHONE%2013"
          probe "https://api.goextracash.com/variants/IPHONE%2013"
          probe "https://api.goextracash.com/devices/IPHONE%2013"
          probe "https://api.goextracash.com/conditions"
          probe "https://api.goextracash.com/condition"
          } > scrape_out/06_probe2.txt 2>&1

      - name: Commit results
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -A scrape_out
          git commit -m "scrape: bundle + probe2 [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
